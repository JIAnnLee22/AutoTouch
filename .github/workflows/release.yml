name: Android tag release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Tag must look like v0.1.0 or v0.1.0-beta.1' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/funnytool-release.jks"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo 'Configure all four ANDROID signing secrets, or none for a preview.' >&2
            exit 1
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No private signing key: producing a debug-key-signed preview; future tags may require reinstalling.'
          fi

      - name: Lint and build installable release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/funnytool-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintDebug :app:assembleRelease \
            -PreleaseVersion="$RELEASE_VERSION" \
            -PreleaseVersionCode="$((1000 + GITHUB_RUN_NUMBER))"

      - name: Prepare APK and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRIVATE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          suffix='preview'
          if [[ "$PRIVATE_SIGNED" == 'true' ]]; then suffix='release'; fi
          cp app/build/outputs/apk/release/app-release.apk "dist/FunnyTool-${RELEASE_TAG}-${suffix}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          # shellcheck disable=SC2016
          printf 'Android 8.0+ · package `jiannlee22.funnytool`\n\n' > dist/NOTES.md
          if [[ "$PRIVATE_SIGNED" == 'true' ]]; then
            printf '使用仓库配置的私有密钥签名，可在签名一致时覆盖升级。\n' >> dist/NOTES.md
          else
            printf '**预览签名**：未配置私有签名 Secrets，使用临时 debug 密钥签署非 debuggable 的 release 构建。不同 tag 之间可能无法覆盖安装；正式使用前请配置稳定密钥。\n' >> dist/NOTES.md
          fi
          printf '\n仅在用户授权无障碍服务并主动开始后执行；锁屏或屏幕变化后不自动恢复。\n' >> dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: FunnyTool-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            app/build/reports/lint-results-debug.html

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
              --verify-tag --title "FunnyTool $RELEASE_TAG" --notes-file dist/NOTES.md "${args[@]}"
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/funnytool-release.jks"
