name: Android tag release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Tag must look like v0.1.0 or v0.1.0-beta.1' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's Ubuntu image already includes Android command-line tools and licenses.
      - name: Install SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --version
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare private signing override or fixed shared signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/funnytool-release.jks"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo 'Configure all four ANDROID signing secrets, or none to use the fixed shared key.' >&2
            exit 1
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            test -s signing/funnytool-shared.p12
            echo '::warning::Using the intentionally public fixed shared development key. Install only trusted builds.'
          fi

      - name: Lint and build installable release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/funnytool-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon --console=plain :app:lintDebug :app:assembleRelease \
              -PreleaseVersion="$RELEASE_VERSION" \
              -PreleaseVersionCode="$((1000 + GITHUB_RUN_NUMBER))" 2>&1 | tee "$RUNNER_TEMP/funnytool-gradle.log"
            build_exit=${PIPESTATUS[0]}
            set -e
            if [[ "$build_exit" == 0 ]]; then break; fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq 'Received status code (429|502|503|504)|Read timed out|Connection reset' "$RUNNER_TEMP/funnytool-gradle.log"; then break; fi
            echo "Transient dependency network error; retrying after $((attempt * 30)) seconds."
            sleep "$((attempt * 30))"
          done
          if [[ "$build_exit" != 0 ]]; then
            summary="$(tail -n 120 "$RUNNER_TEMP/funnytool-gradle.log")"
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            printf '::error title=Gradle build failed::%s\n' "$summary"
            exit "$build_exit"
          fi

      - name: Prepare APK and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRIVATE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FunnyTool-${RELEASE_TAG}-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk | tee dist/SIGNING-CERTIFICATE.txt
          if [[ "$PRIVATE_SIGNED" != 'true' ]]; then
            expected="$(openssl x509 -in signing/funnytool-shared-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2) }' dist/SIGNING-CERTIFICATE.txt)"
            test "$actual" = "$expected"
          fi
          (cd dist && sha256sum ./*.apk SIGNING-CERTIFICATE.txt > SHA256SUMS.txt)
          # shellcheck disable=SC2016
          printf 'Android 8.0+ · package `jiannlee22.funnytool`\n\n' > dist/NOTES.md
          if [[ "$PRIVATE_SIGNED" == 'true' ]]; then
            printf '使用仓库配置的私有密钥签名，可在签名一致时覆盖升级。\n' >> dist/NOTES.md
          else
            printf '**固定共享开发签名**：使用仓库中的固定密钥，后续同证书且版本码递增的安装包可覆盖升级。私钥按用户要求公开，任何人都可用其伪造 APK，仅安装可信构建；不是保密的生产签名。\n\n旧 v0.1.1/v0.1.2 与此证书不同，首次切换通常需要卸载旧版，卸载会丢失配置。\n' >> dist/NOTES.md
          fi
          printf '\n仅在用户授权无障碍服务并主动开始后执行；锁屏或屏幕变化后不自动恢复。\n' >> dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: FunnyTool-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERTIFICATE.txt
            app/build/reports/lint-results-debug.html

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/SIGNING-CERTIFICATE.txt --clobber
          else
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/SIGNING-CERTIFICATE.txt \
              --verify-tag --title "FunnyTool $RELEASE_TAG" --notes-file dist/NOTES.md "${args[@]}"
          fi

      - name: Remove the two superseded preview releases (keep tags)
        if: ${{ steps.version.outputs.tag == 'v0.1.3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old_tag in v0.1.1 v0.1.2; do
            if gh release view "$old_tag" >/dev/null 2>&1; then
              gh release delete "$old_tag" --yes
            fi
          done

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/funnytool-release.jks"
